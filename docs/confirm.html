<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trio — Email confirmed</title>
  <style>
    :root { --brand: #4F6DF5; --brand-dk: #3C56D2; --ink: #1b1c1f; --muted: #6b7280; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dk) 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 40px 28px; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .bars { display: flex; justify-content: center; align-items: flex-end; gap: 7px; height: 56px; margin-bottom: 8px; }
    .bars span { width: 16px; border-radius: 6px; background: var(--brand); }
    .bars span:nth-child(1){ height: 30px; } .bars span:nth-child(2){ height: 44px; } .bars span:nth-child(3){ height: 56px; }
    h1 { color: var(--ink); font-size: 22px; margin: 18px 0 6px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 6px; }
    .check {
      width: 64px; height: 64px; border-radius: 50%; background: #e8f7ee; color: #2e9e5b;
      display: flex; align-items: center; justify-content: center; margin: 8px auto 4px; font-size: 34px;
    }
    .pill {
      display: inline-block; margin-top: 22px; padding: 12px 22px; border-radius: 14px;
      background: var(--brand); color: #fff; font-weight: 600; font-size: 15px;
    }
    .brand { margin-top: 18px; color: var(--brand); font-weight: 700; letter-spacing: .3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bars"><span></span><span></span><span></span></div>
    <div class="check">✓</div>
    <h1>Email confirmed</h1>
    <p>Your Trio account is verified.</p>
    <p>You can close this tab, open the <b>Trio</b> app, and sign in.</p>
    <div class="pill">Return to the app to sign in</div>
    <div class="brand">Trio · Money · Split · Hours</div>
  </div>
</body>
</html>
